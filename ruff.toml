# Shared by server/, tools/flasher/ and tools/preparer/, and by the loose scripts in
# tools/ and packaging/. The Preparer and flasher run on the Python macOS ships.
target-version = "py39"
extend-exclude = ["tools/preparer/payload"]

[lint]
# Named rather than left to ruff's default, which grew in 0.17 from these four groups to
# over a thousand findings here. Widening it is a decision of its own, not a side
# effect of bumping the version.
select = ["E4", "E7", "E9", "F"]
# House style, not mistakes: `if x: return y` on one line, several stdlib imports on
# one line, `l` for a line, and imports below the `sys.path` line that makes them work.
ignore = ["E401", "E402", "E701", "E702", "E741"]

[lint.per-file-ignores]
# The TUI's drawing helpers are imported wholesale.
"tools/flasher/riparr-flash.py" = ["F403", "F405"]
