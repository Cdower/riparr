# Installed as /etc/tmpfiles.d/riparr.conf by apply-system.sh.
#
# Where root-side helpers publish progress and results for the web service to read.
# Root's, and created at boot before any helper runs: a helper that wrote into the
# service's own /run/riparr could be made to write through a symlink the service
# planted there, into any file on the box. The service reads this directory; it
# cannot write it.
d /run/riparr-status 0755 root root -
