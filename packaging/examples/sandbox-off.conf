# The one-file way back from the service's sandbox, for a board that turns up
# something packaging/riparr.service missed. Install as
#
#   /etc/systemd/system/riparr.service.d/sandbox-off.conf
#
# then `systemctl daemon-reload && systemctl restart riparr`, watch
# `journalctl -u riparr -f` for what now works, and please open an issue saying which
# line below made the difference -- that is the DeviceAllow= or path the unit needs.
# Remove the file afterwards: with it in place the service can reach every device and
# every world-writable path on the box.
[Service]
DevicePolicy=auto
DeviceAllow=
ProtectSystem=full
SystemCallFilter=
RestrictAddressFamilies=
