# Demote every Riparr unit's CPU, I/O and memory at once on a shared host. Install as
#
#   /etc/systemd/system/riparr.slice.d/throttle.conf
#
# then `systemctl daemon-reload`. Pick the lines you want; the numbers are a starting
# point for a host that also does something else. See packaging/riparr.slice.
[Slice]
CPUWeight=50
IOWeight=50
MemoryHigh=1G
MemoryMax=1536M
