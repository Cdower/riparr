# Give the default library share's password to the mount unit as a systemd credential
# instead of keeping it in the service's database. Install as
#
#   /etc/systemd/system/riparr-library.service.d/credentials.conf
#   /etc/systemd/system/riparr-remount.service.d/credentials.conf
#
# with the credential itself at /etc/riparr/library.cred, root-owned, mode 0600, in
# mount.cifs's own format:
#
#   username=plex
#   password=the-password
#   domain=WORKGROUP        (optional)
#
# then `systemctl daemon-reload`. tools/mount-library.sh uses the credential for the
# default share when it is present (and the database's password for any other share);
# the password never passes on a command line either way. The file is read by root
# only and handed to the mount helper through $CREDENTIALS_DIRECTORY, which exists for
# the unit's lifetime and nowhere else.
[Service]
LoadCredential=library.cred:/etc/riparr/library.cred
