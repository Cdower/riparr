# The cheap checks, on every push.
#
# There is no test suite yet and this does not pretend there is one. What it does is
# catch the three ways this repository has actually broken: a Python file that no longer
# parses, a JavaScript file with an unbalanced template literal (the whole interface is
# template literals, and one bad backtick blanks every page), and a shell script with a
# syntax error — which for the installer means a box that will not install.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The same hooks that run before every commit, for the commits made without them:
  # ruff over every Python file, ty over each uv project, and server/requirements.txt
  # still matching server/uv.lock.
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ty checks the Preparer inside its own environment, and on Linux that environment
      # has PyGObject in it, which builds from source against these.
      - name: PyGObject build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgirepository1.0-dev libcairo2-dev pkg-config python3-dev

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: prek
        run: uvx prek@0.5.5 run --all-files --show-diff-on-failure

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # For the service's own environment further down: `uv sync --locked` is the one
      # install that is guaranteed to match what the box runs.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Python parses
        run: |
          python -m compileall -q server/riparr tools/preparer tools/flasher

      # Parsing proves a file is syntactically Python. It does not prove the names in it
      # exist, and the gap between those two swallowed the entire self-update feature:
      # `_quit_soon` called `time.sleep` in a module that never imported `time`, so its
      # thread raised NameError on the first line and neither the quit nor the exit that
      # followed it ever ran. Every release from v0.1.5 to v0.1.11 shipped that way. A
      # windowed build has no stderr for a traceback to land in, so what it looked like
      # from outside was an app frozen on "Restarting" -- and two fixes were written for
      # that stall, both editing lines below the one that always raised.
      #
      # pyflakes finds it in milliseconds. Only undefined names fail the build; the rest
      # of what it reports is worth reading and is not worth failing a release over.
      - name: Python names exist
        run: |
          pip install -q pyflakes
          pyflakes server/riparr tools/preparer tools/flasher > "$RUNNER_TEMP/flakes.txt" || true
          grep "undefined name" "$RUNNER_TEMP/flakes.txt" \
            | grep -v "unable to detect undefined names" > "$RUNNER_TEMP/undefined.txt" || true
          if [ -s "$RUNNER_TEMP/undefined.txt" ]; then
            sed 's/^/::error::/' "$RUNNER_TEMP/undefined.txt"
            exit 1
          fi
          echo "ok  every name resolves"
          echo "--- pyflakes also noticed (not fatal) ---"
          cat "$RUNNER_TEMP/flakes.txt"

      # `hostos` is a facade over four backends, and a function implemented in one of them
      # but not re-exported here does not exist as far as any caller is concerned. That is
      # not a hypothetical: `location_status` and `request_location` lived in darwin.py
      # from the day they were written and were never listed in __init__.py, so core.py's
      # `getattr(hostos, ..., None)` found nothing, concluded macOS does not gate Wi-Fi
      # scans on a location permission, and hid the button that asks for one. Wi-Fi band
      # detection was dead in every release, and the omission is invisible from both sides
      # -- the backend has the function, the caller has a fallback.
      #
      # Parsed rather than imported: windows.py cannot be imported on this runner, and the
      # question is about what each file defines, not about what runs.
      - name: hostos exports its whole contract
        run: |
          python - <<'PY'
          import ast, sys

          REQUIRED = [
              "NAME", "CAN_WRITE", "PROVISION_IN_IMAGE", "UPDATE_SUFFIX",
              "list_block_devices", "scan_wifi", "saved_network_password",
              "location_status", "request_location",
              "open_url", "reveal", "keep_awake_command",
              "valid_device_id", "block_device", "raw_device", "partition_devices",
              "unmount_disk", "probe_writable", "open_sink", "open_reader", "flush",
              "rescan_partitions", "mount_boot", "eject", "explain_write_error",
              "elevate", "update_target", "swap_and_relaunch",
          ]

          def defined(path):
              names = set()
              for node in ast.parse(open(path).read()).body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      names.add(node.name)
                  elif isinstance(node, ast.Assign):
                      names |= {t.id for t in node.targets if isinstance(t, ast.Name)}
              return names

          bad = False
          facade = defined("tools/preparer/hostos/__init__.py")
          for n in REQUIRED:
              if n not in facade:
                  print("::error::hostos/__init__.py does not re-export %s" % n)
                  bad = True
          print("ok  facade re-exports %d names" % len(REQUIRED) if not bad else "facade INCOMPLETE")

          for mod in ("darwin", "linux", "windows", "unsupported"):
              have = defined("tools/preparer/hostos/%s.py" % mod)
              gaps = [n for n in REQUIRED if n not in have]
              for n in gaps:
                  print("::error::hostos/%s.py does not implement %s" % (mod, n))
              print(("ok  " if not gaps else "BAD ") + mod)
              bad = bad or bool(gaps)

          sys.exit(1 if bad else 0)
          PY

      - name: JavaScript parses
        run: |
          for f in server/static/app.js server/static/icons.js \
                   tools/preparer/ui/app.js tools/preparer/ui/bridge-shim.js; do
            node --check "$f" && echo "ok  $f"
          done

      # The bridge shim has shipped broken twice, in opposite directions, and neither
      # failure is visible by reading it -- both depend on when pywebview attaches its
      # api relative to when the script runs. This asserts both timings.
      - name: The bridge shim survives every bridge timing
        run: |
          node tools/preparer/ui/bridge-shim.test.js

      # The interface is one HTML file edited by hand and by script. A stray unbalanced
      # div silently swallows a screen's footer, which is how the Review buttons ended
      # up off the bottom of the window.
      - name: The interface markup is balanced
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          import sys
          VOID = {"area","base","br","col","embed","hr","img","input","link","meta",
                  "source","track","wbr"}
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]; self.err=[]
              def handle_starttag(self, t, a):
                  if t not in VOID: self.stack.append((t, self.getpos()[0]))
              def handle_endtag(self, t):
                  if t in VOID: return
                  if self.stack and self.stack[-1][0] == t: self.stack.pop()
                  else: self.err.append("line %d: stray </%s>" % (self.getpos()[0], t))
          for f in ("tools/preparer/ui/index.html", "server/static/index.html"):
              p = P(); p.feed(open(f).read())
              bad = p.err + ["line %d: <%s> never closed" % (l, t) for t, l in p.stack]
              for b in bad:
                  print("::error::%s: %s" % (f, b))
              if bad:
                  sys.exit(1)
              print("ok  %s" % f)
          PY

      # The update swap, against the failure that ate a live box's virtualenv.
      #
      # v0.1.18 moved /opt/riparr aside to put the new version in its place. The service
      # runs as `riparr` and /opt is root-owned, so that raised PermissionError every
      # time -- appliance self-update had never once worked. And it carried the venv into
      # a temp directory *before* that step, which the `finally` then deleted: a failed
      # update reported "Nothing was changed" while removing the interpreter the service
      # is defined to run. The box kept serving from open file handles and would not have
      # survived its next restart.
      #
      # Run against that version this fails on "THE VIRTUALENV SURVIVED".
      - name: The update swap keeps the virtualenv
        run: |
          python server/updater-swap.test.py

      # A 3D Blu-ray's two cuts are the same film at the same length, so longest-wins
      # picks the 3D one -- twice the size, and most players will not use it. The first
      # fix for that took the smallest title of any runtime tie, which on an obfuscated
      # disc means picking a decoy playlist over the film. Both regressions are in here.
      - name: The right title comes off the disc
        run: |
          python server/choose-title.test.py

      # A backup is a folder of a few hundred files, and the pipeline was built for one
      # job making one file. This runs every stage -- staged and direct, resume after a
      # power cut, verify, purge, the never-overwrite rule, the DVD-tools fallback --
      # against the mock drive and share. It also caught staged films losing their year.
      - name: Full-disc backups go through the whole pipeline
        run: |
          python server/backup-pipeline.test.py

      # The tests from here on that import the service itself need fastapi, and the
      # runner's Python has none. The steps above never needed it: they exercise pipeline
      # modules that import only the standard library, so they stay on the runner's
      # Python. Without this, the restore test fails on `import fastapi` before it tests
      # anything, and every step after it is skipped, which reads as a regression and is
      # one missing install. `uv sync --locked` installs exactly what server/uv.lock pins,
      # which is what `uv run --locked` gives the box, into server/.venv.
      - name: The service's dependencies, for the tests that import it
        run: |
          uv sync --locked --directory server

      # A restore put the settings back and threw the shares and the disc history away,
      # while saying the shares only needed a password. And none of the three doors a
      # setting arrives through looked at the value, so text where a number belonged
      # was a 500 on every dashboard poll.
      - name: A backup restores everything it carried
        run: |
          server/.venv/bin/python server/backup-restore.test.py

      # Two cancels that were heard and then ignored: one during the identify scan,
      # overwritten by "queued" when the scan finished; one during a real upload,
      # noticed only once the whole file had landed on the share.
      - name: A cancel sticks wherever it lands
        run: |
          python server/cancel-mid-flight.test.py

      # Music CDs, through the real tools: cd-paranoia reading a synthesized disc image,
      # cd-info reading its CD-Text, flac and lame encoding, bsdtar copying a data CD.
      # Nothing here had a CD drive when it was written, so the tools themselves are the
      # closest thing to hardware there is -- and the runner's versions (lame 3.100,
      # libcdio 2.1) are older than the development machine's, which is the point: the
      # output being parsed is checked against two releases of each tool.
      - name: Music CDs go through the whole pipeline
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cd-paranoia libcdio-utils \
            flac lame opus-tools vorbis-tools libarchive-tools xorriso ffmpeg >/dev/null
          python server/music-pipeline.test.py

      # The sampling profiler, against a local Pyroscope stand-in. It checks the folded
      # format the ingest endpoint parses, the basic-auth header, that a stack is weighted
      # by CPU time and not wall time, that a window closes on schedule and survives the
      # clock stepping backwards, and that a failed upload never carries the token in its
      # error. This is the only place the Linux branch runs: it asserts that
      # `pthread_getcpuclockid` works and that the profiler reports `cpu` mode, and on
      # the macOS development machine the same code falls back to wall time. Break the
      # per-thread clock and a box would send profiles that look like a busy service
      # when it is an idle one, and nobody would know until they chased a ghost.
      - name: The profiler samples CPU time and uploads folded stacks
        run: |
          server/.venv/bin/python server/profiling.test.py

      # Profiling is configured from the Settings page, and the token is a credential.
      # This checks the defaults, that a value of the wrong type is refused, that
      # /api/settings masks the token, that the test button turns a failed upload into a
      # 400 carrying the reason, and that saving a profiling setting reaches the profiler
      # with no restart. A regression here either leaks a Grafana token into a page the
      # user may screenshot for a forum, or leaves the profiler running on old settings.
      - name: Profiling settings save, mask the token and apply live
        run: |
          server/.venv/bin/python server/profiling-settings.test.py

      # /api/status is polled about once a second during a rip by every open dashboard, and the optimisations
      # behind it are caches. A cache that is not invalidated shows something stale: a
      # setting that reverts after a save, a user count that stays at zero after the
      # first account, queue medians that ignore a job that just finished. This pins each
      # cache to the writes that must clear it, and checks that one status request reads
      # the drives once and still returns every key the browser expects.
      - name: The status caches expire and invalidate correctly
        run: |
          server/.venv/bin/python server/status-cache.test.py

      # MakeMKV prints a progress line many times a second, and each one used to be a
      # directory listing, an UPDATE and a commit. Now
      # it is written at most twice a second. Without this check a change that drops the
      # throttle brings back sixty writes for sixty lines, and nothing else would notice,
      # because the rip still finishes. It also checks that settings save, config import
      # and backup upload run on the threadpool, because on the event loop each one
      # stalls every poll in flight.
      - name: Rip progress is throttled without losing the last value
        run: |
          server/.venv/bin/python server/progress-throttle.test.py

      # The benchmark is what the speed-up claims are measured with, so a benchmark that
      # quietly prints nothing useful would make them worthless. This starts a real
      # uvicorn in mock mode, runs six cycles and checks the report has the status row,
      # the idle and profile sections, the CPU figure and the saved stacks. It starts a
      # real server, so it is the slowest of these and the one step here that needs a free
      # port.
      - name: The benchmark runs and reports what it promises
        run: |
          server/.venv/bin/python server/bench.test.py

      # The card write's data-in, data-out pieces: sector arithmetic, device names,
      # partition classification -- and since Raspberry Pi OS Trixie dropped custom.toml,
      # the cloud-init seed files a Pi card boots from. Wrong seed files boot a stock image
      # with no Wi-Fi and nothing saying why.
      - name: Preparer selftest
        working-directory: tools/preparer
        run: |
          python selftest.py

      # Root helpers run before riparr.service ever has, on a fresh box. One opened the
      # database with a plain sqlite3.connect(), created it empty and root-owned, and the
      # service died on its first write -- every fresh install, on every platform.
      - name: Root helpers never create the database
        run: |
          d=$(mktemp -d)
          RIPARR_DB="$d/riparr.db" bash tools/mount-library.sh
          if [ -e "$d/riparr.db" ]; then
            echo "::error::mount-library.sh created the database"; exit 1
          fi
          if grep -n "sqlite3.connect(" tools/*.sh packaging/*.sh | grep -v "mode=ro" | grep -v "^[^:]*:[0-9]*:#"; then
            echo "::error::a root script opens the database writable"; exit 1
          fi
          echo "ok  no root helper can create riparr.db"

      # "Already mounted" used to be the answer whenever anything was at /srv/library,
      # so moving or deleting the default share left the old NAS mounted there and
      # direct-mode rips kept landing on it. Every mount call is stubbed and recorded;
      # the script and the database it reads are real.
      - name: The library mount follows the default share
        run: |
          bash tools/mount-library.test.sh

      - name: Shell parses
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" && echo "ok  $f"
          done

      - name: systemd units are well formed
        run: |
          # No systemd-analyze on the runner for a unit that names paths which do not
          # exist here, so this is the shape check: every unit has a [Unit] section and
          # every .path has a [Path] with something to watch.
          fail=0
          for f in $(git ls-files 'packaging/*.service' 'packaging/*.path'); do
            grep -q '^\[Unit\]' "$f" || { echo "no [Unit] in $f"; fail=1; }
            case "$f" in
              *.path) grep -qE '^Path(Exists|Changed|Modified|ExistsGlob)=' "$f" \
                        || { echo "no Path*= in $f"; fail=1; } ;;
              *.service) grep -q '^\[Service\]' "$f" \
                        || { echo "no [Service] in $f"; fail=1; } ;;
            esac
            echo "ok  $f"
          done
          exit $fail

      - name: The MakeMKV manifest is readable and pinned
        run: |
          python - <<'PY'
          import json
          m = json.load(open("packaging/makemkv-manifest.json"))
          assert m["packages"], "no packages"
          for p in m["packages"]:
              assert len(p["sha256"]) == 64, p["name"]
              assert p["urls"], p["name"]
              print(p["name"], len(p["urls"]), "sources")
          PY

      - name: The service starts and answers
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r server/requirements.txt
          cd server
          RIPARR_DB=/tmp/ci.db /tmp/venv/bin/python -m uvicorn riparr.main:app \
            --host 127.0.0.1 --port 9797 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9797/api/status >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9797/api/status | head -c 200; echo
          curl -fsS http://127.0.0.1:9797/api/setup/state
